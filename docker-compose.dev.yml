# Utilisé en dev local : docker compose -f docker-compose.dev.yml up
services:
  app:
    build: .
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      # Cf. docker-compose.yml : restreindre à 127.0.0.1 (Docker contourne UFW sinon).
      # ⚠️ TEMPORAIRE : ouvert au LAN pour test mobile — REMETTRE 127.0.0.1 après.
      - "0.0.0.0:8100:8100"
    volumes:
      - ./data:/app/data
      # Lecture seule : permet à config.py de lire le commit réellement monté
      # (le code est hot-reloadé, la version figée au build serait fausse).
      - ./.git:/app/.git:ro
      # Tag de version (généré par `make version-file` ou le hook git post-commit).
      - ./.version:/app/.version:ro
      # Hot-reload du code sans rebuild (pratique en dev)
      - ./app.py:/app/app.py
      - ./models.py:/app/models.py
      - ./contact_set.py:/app/contact_set.py
      - ./contact_filters.py:/app/contact_filters.py
      - ./connectors.py:/app/connectors.py
      - ./noe.py:/app/noe.py
      - ./tools:/app/tools
      - ./config.py:/app/config.py
      - ./extensions.py:/app/extensions.py
      - ./helpers.py:/app/helpers.py
      - ./blueprints:/app/blueprints
      - ./mailer.py:/app/mailer.py
      - ./fields.py:/app/fields.py
      - ./imap_submissions.py:/app/imap_submissions.py
      - ./bounce_scanner.py:/app/bounce_scanner.py
      - ./submission_notifier.py:/app/submission_notifier.py
      - ./audit.py:/app/audit.py
      - ./templates:/app/templates
      - ./static:/app/static
    env_file:
      - .env
    environment:
      # DEV : recharge les templates Jinja à chaud (plus besoin de restart après
      # une édition de template). Ne PAS mettre en prod.
      - TEMPLATES_AUTO_RELOAD=true